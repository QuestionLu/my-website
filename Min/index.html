<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>踩地雷測試畫面</title>
    <style>
        /* 全螢幕居中排版 */
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e; /* 深灰色背景，適合觀看影片 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 影片外殼：限制最大寬度，並強制維持 16:9 比例 */
        .video-container {
            width: 90%;
            max-width: 800px;
            aspect-ratio: 16 / 9; /* 自動計算 16:9 高度，防止畫面拉伸 */
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* 讓內嵌的 YouTube iframe 完美填滿外殼 */
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/BlYYzRApTfw?si=CEKI44T0UgGalZjp" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

</body>
</html>
