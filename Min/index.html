<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>踩地雷測試畫面</title>
    <style>
        /* 基礎全螢幕居中排版 */
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e; /* 深灰色背景，適合觀看影片 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 影片外殼：限制最大寬度並加上陰影 */
        .video-wrapper {
            width: 90%;
            max-width: 800px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* 確保影片寬度填滿外殼 */
        video {
            width: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <video controls preload="metadata" playsinline>
            <source src="minesweeper_test.mp4" type="video/mp4">
            您的瀏覽器不支援 HTML5 影片播放。
        </video>
    </div>

</body>
</html>
